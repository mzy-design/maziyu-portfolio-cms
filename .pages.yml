media:
  input: images
  output: images
  extensions: [jpg, jpeg, png, webp, gif]
content:
  - name: home
    label: 首页
    type: file
    path: content/home.json
    format: json
    fields:
      - { name: name, label: 姓名, type: string }
      - { name: hero, label: 主标题, type: string }
      - { name: intro, label: 简介, type: text }
      - { name: location, label: 所在地, type: string }
      - { name: background, label: 首页背景, type: image }
      - name: projects
        label: 首页项目
        type: object
        list: true
        fields:
          - { name: title, label: 项目名, type: string }
          - { name: tags, label: 分类, type: string }
          - { name: image, label: 封面, type: image }
          - { name: href, label: 页面链接, type: string }
          - { name: wide, label: 横跨整行, type: boolean, default: false }
  - name: works
    label: 作品列表
    type: file
    path: content/works.json
    format: json
    fields:
      - { name: title, label: 标题, type: string }
      - { name: intro, label: 简介, type: text }
      - name: projects
        label: 作品
        type: object
        list: true
        fields:
          - { name: title, label: 项目名, type: string }
          - { name: tags, label: 分类, type: string }
          - { name: image, label: 封面, type: image }
          - { name: href, label: 页面链接, type: string }
  - name: about
    label: 关于
    type: file
    path: content/about.json
    format: json
    fields:
      - name: introduction
        label: About 首屏
        type: object
        fields:
          - { name: heading, label: 标题, type: string }
          - { name: zh, label: 中文段落, type: text, list: true }
          - { name: en, label: 英文翻译, type: text, list: true }
          - { name: portrait, label: 竖版图片, type: image, required: false }
          - { name: detailImage, label: 横版图片, type: image, required: false }
      - { name: experienceIntro, label: Experience 解释文案, type: text }
      - { name: experienceImage, label: Experience 左侧图片, type: image, required: false }
      - name: experience
        label: 工作经历
        type: object
        list: true
        fields:
          - { name: companyZh, label: 公司中文名, type: string }
          - { name: companyEn, label: 公司英文名, type: string }
          - { name: roleZh, label: 职位中文名, type: string }
          - { name: roleEn, label: 职位英文名, type: string }
          - { name: years, label: 时间, type: string }
          - { name: en, label: 英文说明, type: text }
          - { name: zh, label: 中文说明, type: text }
      - name: brands
        label: 合作品牌
        type: object
        fields:
          - { name: names, label: 品牌名称, type: string, list: true }
          - { name: noteEn, label: 说明（英文）, type: text }
          - { name: noteZh, label: 说明（中文）, type: text }
      - name: capabilities
        label: 核心能力
        type: object
        list: true
        fields:
          - { name: titleEn, label: 标题（英文）, type: string }
          - { name: titleZh, label: 标题（中文）, type: string }
          - { name: en, label: 说明（英文）, type: text }
          - { name: zh, label: 说明（中文）, type: text }
          - { name: keywords, label: 关键词, type: string, list: true }
      - name: process
        label: 从概念到量产
        type: object
        list: true
        fields:
          - { name: stageEn, label: 阶段（英文）, type: string }
          - { name: stageZh, label: 阶段（中文）, type: string }
          - { name: keywordsEn, label: 关键词（英文）, type: string }
          - { name: keywordsZh, label: 关键词（中文）, type: string }
      - { name: processStatementEn, label: 流程陈述（英文）, type: text }
      - { name: processStatementZh, label: 流程陈述（中文）, type: text }
      - name: bring
        label: 我的价值
        type: object
        list: true
        fields:
          - { name: titleEn, label: 标题（英文）, type: string }
          - { name: titleZh, label: 标题（中文）, type: string }
          - { name: en, label: 说明（英文）, type: text }
          - { name: zh, label: 说明（中文）, type: text }
      - name: values
        label: 设计原则
        type: object
        list: true
        fields:
          - { name: titleEn, label: 标题（英文）, type: string }
          - { name: titleZh, label: 标题（中文）, type: string }
          - { name: en, label: 说明（英文）, type: text }
          - { name: zh, label: 说明（中文）, type: text }
      - name: recognition
        label: 奖项与成果
        type: object
        list: true
        fields:
          - { name: title, label: 标题, type: string }
          - { name: result, label: 结果, type: string, required: false }
          - { name: en, label: 说明（英文）, type: text }
          - { name: zh, label: 说明（中文）, type: text }
      - name: tools
        label: 工具与方法
        type: object
        list: true
        fields:
          - { name: group, label: 分组, type: string }
          - { name: items, label: 条目, type: string, list: true }
      - name: cta
        label: 联系 CTA
        type: object
        fields:
          - { name: titleEn, label: 标题（英文）, type: text }
          - { name: titleZh, label: 标题（中文）, type: text }
          - { name: bodyEn, label: 正文（英文）, type: text, list: true }
          - { name: bodyZh, label: 正文（中文）, type: text, list: true }
          - { name: labelEn, label: 按钮（英文）, type: string }
          - { name: labelZh, label: 按钮（中文）, type: string }
  - name: contact
    label: 联系
    type: file
    path: content/contact.json
    format: json
    fields:
      - { name: title, label: 标题, type: text }
      - { name: email, label: 邮箱, type: string }
      - { name: copyLabel, label: 复制邮箱按钮, type: string }
      - { name: wechatLabel, label: 微信按钮, type: string }
      - { name: wechatImage, label: 微信二维码, type: image, required: false }
      - { name: wechatPlaceholder, label: 二维码占位文字, type: string }
      - { name: socials, label: 社交链接, type: object, list: true, fields: [{ name: label, label: 名称, type: string }, { name: href, label: 链接, type: string }] }
  - name: projects
    label: 作品详情（11 个独立页面）
    type: collection
    path: content/projects
    format: json
    fields:
      - { name: number, label: 编号, type: string }
      - { name: title, label: 项目名, type: string }
      - { name: subtitle, label: 副标题, type: string }
      - { name: year, label: 年份, type: string }
      - { name: services, label: 服务, type: string, list: true }
      - { name: hero, label: 主图, type: image, required: false }
      - { name: overview, label: 项目概述, type: text, required: false }
      - name: sections
        label: 内容章节
        type: object
        list: true
        fields:
          - { name: heading, label: 标题, type: string }
          - { name: body, label: 正文, type: text, required: false }
          - { name: image, label: 图片, type: image, required: false }
      - { name: gallery, label: 画廊, type: image, list: true }
      - name: next
        label: 下一项目
        type: object
        fields:
          - { name: title, label: 标题, type: string }
          - { name: href, label: 链接, type: string }
