media:
  input: images
  output: images
  extensions: [jpg, jpeg, png, webp, gif]
content:
  - name: home
    label: 首页
    type: file
    path: content/home.json
    format: json
    fields:
      - { name: name, label: 姓名, type: string }
      - { name: hero, label: 主标题, type: string }
      - { name: intro, label: 简介, type: text }
      - { name: location, label: 所在地, type: string }
      - { name: background, label: 首页背景, type: image }
      - name: projects
        label: 首页项目
        type: object
        list: true
        fields:
          - { name: title, label: 项目名, type: string }
          - { name: tags, label: 分类, type: string }
          - { name: image, label: 封面, type: image }
          - { name: href, label: 页面链接, type: string }
          - { name: wide, label: 横跨整行, type: boolean, default: false }
  - name: works
    label: 作品列表
    type: file
    path: content/works.json
    format: json
    fields:
      - { name: title, label: 标题, type: string }
      - { name: intro, label: 简介, type: text }
      - name: projects
        label: 作品
        type: object
        list: true
        fields:
          - { name: title, label: 项目名, type: string }
          - { name: tags, label: 分类, type: string }
          - { name: image, label: 封面, type: image }
          - { name: href, label: 页面链接, type: string }
  - name: about
    label: 关于
    type: file
    path: content/about.json
    format: json
    fields:
      - name: introduction
        label: About 首屏
        type: object
        fields:
          - { name: heading, label: 标题, type: string }
          - { name: zh, label: 中文段落, type: text, list: true }
          - { name: en, label: 英文翻译, type: text, list: true }
          - { name: portrait, label: 竖版图片, type: image, required: false }
          - { name: detailImage, label: 横版图片, type: image, required: false }
      - name: experience
        label: 工作经历
        type: object
        list: true
        fields:
          - { name: company, label: 公司, type: string }
          - { name: companyEn, label: 公司英文, type: string }
          - { name: role, label: 职位, type: string }
          - { name: roleEn, label: 职位英文, type: string }
          - { name: years, label: 时间, type: string }
          - name: highlights
            label: 项目与职责
            type: object
            list: true
            fields:
              - { name: title, label: 标题, type: string }
              - { name: titleEn, label: 标题英文, type: string }
              - { name: zh, label: 中文原文, type: text }
              - { name: en, label: 英文翻译, type: text }
      - name: education
        label: 教育经历
        type: object
        fields:
          - { name: school, label: 学校, type: string }
          - { name: schoolEn, label: 学校英文, type: string }
          - { name: degree, label: 学历专业, type: string }
          - { name: degreeEn, label: 学历专业英文, type: string }
          - { name: years, label: 时间, type: string }
          - { name: details, label: 中文信息, type: string, list: true }
          - { name: detailsEn, label: 英文翻译, type: string, list: true }
      - name: recognition
        label: 奖项与成果
        type: object
        list: true
        fields:
          - { name: title, label: 标题, type: string }
          - { name: titleEn, label: 标题英文, type: string, required: false }
          - { name: zh, label: 中文原文, type: text }
          - { name: en, label: 英文翻译, type: text }
      - name: skills
        label: 核心能力与语言
        type: object
        list: true
        fields:
          - { name: group, label: 分组中文, type: string }
          - { name: groupEn, label: 分组英文, type: string }
          - { name: items, label: 中文条目, type: string, list: true }
          - { name: itemsEn, label: 英文条目, type: string, list: true }
      - name: cta
        label: 联系 CTA
        type: object
        fields:
          - { name: label, label: 英文, type: string }
          - { name: labelZh, label: 中文, type: string }
  - name: contact
    label: 联系
    type: file
    path: content/contact.json
    format: json
    fields:
      - { name: title, label: 标题, type: text }
      - { name: email, label: 邮箱, type: string }
      - { name: copyLabel, label: 复制邮箱按钮, type: string }
      - { name: wechatLabel, label: 微信按钮, type: string }
      - { name: wechatImage, label: 微信二维码, type: image, required: false }
      - { name: wechatPlaceholder, label: 二维码占位文字, type: string }
      - { name: socials, label: 社交链接, type: object, list: true, fields: [{ name: label, label: 名称, type: string }, { name: href, label: 链接, type: string }] }
  - name: projects
    label: 作品详情（11 个独立页面）
    type: collection
    path: content/projects
    format: json
    fields:
      - { name: number, label: 编号, type: string }
      - { name: title, label: 项目名, type: string }
      - { name: subtitle, label: 副标题, type: string }
      - { name: year, label: 年份, type: string }
      - { name: services, label: 服务, type: string, list: true }
      - { name: hero, label: 主图, type: image, required: false }
      - { name: overview, label: 项目概述, type: text, required: false }
      - name: sections
        label: 内容章节
        type: object
        list: true
        fields:
          - { name: heading, label: 标题, type: string }
          - { name: body, label: 正文, type: text, required: false }
          - { name: image, label: 图片, type: image, required: false }
      - { name: gallery, label: 画廊, type: image, list: true }
      - name: next
        label: 下一项目
        type: object
        fields:
          - { name: title, label: 标题, type: string }
          - { name: href, label: 链接, type: string }
